<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      A Picture of the Day
    </ion-title>
  </ion-toolbar>
</ion-header>
 
<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">A Picture of the Day</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ apodTitle }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <img src="{{ apodImage }}" alt="Picture of the Day" />
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-datetime [(ngModel)]="selectedDate"></ion-datetime>
  </ion-card>

  <ion-button expand="full" (click)="loadPictureByDate()">Load Picture</ion-button>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Mars Photos</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>NASA's Curiosity, Opportunity, and Spirit rovers on Mars sent many photos until {{ currentSol }} sols</p>
    </ion-card-content>
    <ion-item>
      <ion-label>Enter Sol</ion-label>
      <ion-input type="number" [(ngModel)]="selectedSol"></ion-input>
    </ion-item>
    <ion-button expand="full" (click)="loadMarsPhotosBySol()">Search</ion-button>
    <ion-grid *ngIf="marsPhotos.length > 0">
      <ion-row>
        <ion-col size="6" *ngFor="let photo of marsPhotos">
          <ion-img [src]="photo.img_src" alt="Mars Photo"></ion-img>
        </ion-col>
      </ion-row>
    </ion-grid>
    <p *ngIf="marsPhotos.length === 0" class="no-photos">No picture on this sol</p>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>NASA Image Library</ion-card-title>
    </ion-card-header>
    <ion-grid *ngIf="nasaMedia.length > 0">
      <ion-row>
        <ion-col size="6" *ngFor="let media of nasaMedia.slice(0, 6)">
          <ion-img [src]="media.href" alt="NASA Image"></ion-img>
        </ion-col>
      </ion-row>
    </ion-grid>
    <p *ngIf="nasaMedia.length === 0" class="no-photos">No photos available</p>
  </ion-card>
</ion-content>
