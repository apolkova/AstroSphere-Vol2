<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Space Quiz</ion-title>
    <ion-buttons slot="end">
    
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Space Quiz</ion-title>
        <ion-buttons slot="end">
        </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <div *ngIf="currentQuestion">
      <ion-card>
        <ion-card-header>
          <ion-card-title>{{ currentQuestion.question }}</ion-card-title>
        </ion-card-header>
      </ion-card>
  
      <ion-grid>
        <ion-row>
          <ion-col size="6" *ngFor="let answer of currentQuestion?.answers">
            <ion-button
              expand="block"
              [color]="
                isAnswered
                  ? answer === correctAnswer
                    ? 'success'
                    : answer === selectedAnswer
                    ? 'danger'
                    : 'medium'
                  : 'primary'
              "
              [disabled]="isAnswered"
              (click)="selectAnswer(answer)"
            >
              {{ answer }}
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>

      <ion-card>
        <ion-card-content>
          <p>Score: {{ score }}</p>
        </ion-card-content>
      </ion-card>


    <div *ngIf="!currentQuestion">
      <h1 class="ion-text-center">Quiz Complete!</h1>
      <h2 class="ion-text-center">Final Score: {{ score }}</h2>
      <ion-button expand="full" (click)="restartQuiz()">Start Over</ion-button>
    </div>
  </ion-content>
